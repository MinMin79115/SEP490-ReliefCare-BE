# =============================================================
# ReliefCare - Local Development Docker Compose
# =============================================================
# Dùng để chạy và test trên máy local.
#
# Cách dùng:
#   docker compose -f compose.local.yaml up --build
#   docker compose -f compose.local.yaml up --build -d   (chạy background)
#   docker compose -f compose.local.yaml down            (dừng)
#   docker compose -f compose.local.yaml down -v         (dừng + xóa volume)
#   docker compose -f compose.local.yaml logs -f         (xem log)
#
# Swagger UI: http://localhost:8080/swagger
# API:        http://localhost:8080
# PostgreSQL: localhost:5432
# =============================================================

services:
  # -----------------------------------------------------------
  # PostgreSQL Database
  # -----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: reliefcare-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relief_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    networks:
      - reliefcare-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-relief_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -----------------------------------------------------------
  # ReliefCare API - Build từ source code local
  # -----------------------------------------------------------
  reliefcare-api:
    container_name: reliefcare-local-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: ReliefManagementSystem.API/Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-relief_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres123}"

      # JWT - chỉ dùng cho local, KHÔNG dùng key này cho production
      Jwt__Key: ${JWT_KEY:-local-dev-reliefcare-secret-key-minimum-32-characters-long}
      Jwt__Issuer: ${JWT_ISSUER:-ReliefSystem}
      Jwt__Audience: ${JWT_AUDIENCE:-ReliefClient}
      Jwt__AccessTokenMinutes: "60"
      Jwt__RefreshTokenDays: "7"

      # Google OAuth (tuỳ chọn, để trống nếu không test Google login)
      AuthenticationGoogle__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      AuthenticationGoogle__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}

      # CORS - cho phép các frontend local phổ biến
      CorsSettings__AllowedOrigins__0: "http://localhost:3000"
      CorsSettings__AllowedOrigins__1: "http://localhost:5173"
      CorsSettings__AllowedOrigins__2: "http://localhost:4200"
      CorsSettings__AllowedOrigins__3: "http://localhost:8080"

      # ASP.NET Core - Development mode bật Swagger
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"

      # Logging - verbose hơn để dễ debug
      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__Microsoft__AspNetCore: "Information"
      Logging__LogLevel__Microsoft__EntityFrameworkCore: "Information"
    ports:
      - "8080:8080"
    networks:
      - reliefcare-local
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

# -----------------------------------------------------------
# Volumes
# -----------------------------------------------------------
volumes:
  postgres_local_data:
    name: reliefcare-local-postgres-data

# -----------------------------------------------------------
# Networks
# -----------------------------------------------------------
networks:
  reliefcare-local:
    name: reliefcare-local-network
    driver: bridge
