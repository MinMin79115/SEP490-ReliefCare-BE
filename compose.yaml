services:
  postgres:
    image: postgres:16-alpine
    container_name: reliefcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relief_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - reliefcare-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-relief_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - production
      - development
      - reliefcare-api
  reliefcare-api:
    image: ${REGISTRY:-reliefcare-api}:latest
    container_name: reliefcare-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: ReliefManagementSystem.API/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-relief_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres123}"
      
      # JWT Configuration
      Jwt__Key: ${JWT_KEY:-docker-dev-reliefcare-secret-key-change-this-in-production-min-32-chars}
      Jwt__Issuer: ${JWT_ISSUER:-ReliefSystem}
      Jwt__Audience: ${JWT_AUDIENCE:-ReliefClient}
      Jwt__AccessTokenMinutes: "15"
      Jwt__RefreshTokenDays: "7"
      
      AuthenticationGoogle__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      AuthenticationGoogle__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      
      # CORS - Add your frontend URLs
      CorsSettings__AllowedOrigins__0: "http://localhost:3000"
      CorsSettings__AllowedOrigins__1: "http://localhost:5173"
      CorsSettings__AllowedOrigins__2: "http://localhost:4200"
      CorsSettings__AllowedOrigins__3: "https://reliefhub.info.vn"
      CorsSettings__AllowedOrigins__4: "https://api.reliefhub.info.vn"
      CorsSettings__AllowedOrigins__5: ${CORS_ORIGINS:-}
      
      # ASP.NET Core
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: "http://+:8080"
      
      # Logging
      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__Microsoft__AspNetCore: "Warning"
      Logging__LogLevel__Microsoft__EntityFrameworkCore: "Information"
    ports:
      - "8080:8080"
    networks:
      - reliefcare-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - production
      - development
      - reliefcare-api

  # ===========================================
  # ReliefCare Crawler - Web Scraping Service
  # ===========================================
  reliefcare-crawler:
    image: ${REGISTRY:-reliefcare-crawler}:latest
    container_name: reliefcare-crawler
    build:
      context: ./RelieftManagement.Crawler
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-relief_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres123}"
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"
    volumes:
      - ./crawler-output:/app/output
    networks:
      - reliefcare-network
    restart: "no"
    profiles:
      - crawler
      - reliefcare-crawler

  # ===========================================
  # Cloudflare Tunnel - Expose to Internet
  # ===========================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: reliefcare-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      reliefcare-api:
        condition: service_healthy
    networks:
      - reliefcare-network
    profiles:
      - production

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres_data:
    name: reliefcare-postgres-data

# ===========================================
# Networks
# ===========================================
networks:
  reliefcare-network:
    name: reliefcare-network
    driver: bridge