# =============================================================
# ReliefCare - Local Development Docker Compose
# =============================================================
# Dùng để chạy và test trên máy local.
# Dùng biến môi trường qua file .env (không commit secret)
#
# Cách dùng:
#   docker compose up --build
#   docker compose up --build -d   (chạy background)
#   docker compose down            (dừng)
#   docker compose down -v         (dừng + xóa volume)
#   docker compose logs -f         (xem log)
#
# Swagger UI: http://localhost:8080/swagger
# API:        http://localhost:8080
# PostgreSQL: localhost:5432
# pgAdmin:    http://localhost:5050  (admin@reliefcare.local / admin123)
# =============================================================

services:
  # -----------------------------------------------------------
  # PostgreSQL Database
  # -----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: reliefcare-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relief_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    networks:
      - reliefcare-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-relief_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -----------------------------------------------------------
  # ReliefCare API - Build từ source code local
  # -----------------------------------------------------------
  reliefcare-api:
    container_name: reliefcare-local-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: ReliefManagementSystem.API/Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Database
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-relief_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"

      # JWT - chỉ dùng cho local, KHÔNG dùng key này cho production
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-ReliefSystem}
      Jwt__Audience: ${JWT_AUDIENCE:-ReliefClient}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-7}

      # Google OAuth - để trống, không test Google login trên local docker
      AuthenticationGoogle__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      AuthenticationGoogle__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}

      # Email (Brevo SMTP) - để test gửi email local
      EmailSettings__Host: ${EMAIL_HOST:-smtp-relay.brevo.com}
      EmailSettings__Port: ${EMAIL_PORT:-587}
      EmailSettings__Username: ${EMAIL_USERNAME:-}
      EmailSettings__Password: ${EMAIL_PASSWORD:-}
      EmailSettings__SenderEmail: ${EMAIL_SENDER_EMAIL:-noreply@reliefhub.info.vn}
      EmailSettings__SenderName: ${EMAIL_SENDER_NAME:-Relief Hub}

      # Cloudinary - để test upload ảnh local
      CloudinarySettings__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      CloudinarySettings__ApiKey: ${CLOUDINARY_API_KEY:-}
      CloudinarySettings__ApiSecret: ${CLOUDINARY_API_SECRET:-}

      # Goong
      Goong__BaseUrl: ${GOONG_BASE_URL:-https://rsapi.goong.io}
      Goong__ApiKey: ${GOONG_API_KEY:-}

      # Weather API
      WeatherApi__BaseUrl: ${WEATHER_API_BASE_URL:-https://api.weatherapi.com/v1}
      WeatherApi__ApiKey: ${WEATHER_API_KEY:-}

      # PayOS
      PayOs__ClientId: ${PAYOS_CLIENT_ID:-}
      PayOs__ApiKey: ${PAYOS_API_KEY:-}
      PayOs__ChecksumKey: ${PAYOS_CHECKSUM_KEY:-}
      PayOs__ReturnUrl: ${PAYOS_RETURN_URL:-http://localhost:5173/donation/return}
      PayOs__CancelUrl: ${PAYOS_CANCEL_URL:-http://localhost:5173/donation/cancel}
      PayOs__ExpiredMinutes: ${PAYOS_EXPIRED_MINUTES:-15}

      # CORS
      CorsSettings__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-*}

      # ASP.NET Core - Development mode bật Swagger
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"

      # Logging - verbose hơn để dễ debug
      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__Microsoft__AspNetCore: "Warning"
      Logging__LogLevel__Microsoft__EntityFrameworkCore: "Information"
    ports:
      - "8080:8080"
    networks:
      - reliefcare-local
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s

  # -----------------------------------------------------------
  # pgAdmin 4 - Giao diện quản lý PostgreSQL
  # -----------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: reliefcare-local-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@reliefcare.com"
      PGADMIN_DEFAULT_PASSWORD: "admin123"
      PGADMIN_CONFIG_SERVER_MODE: "False"              # Desktop mode - không cần login lần 2
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_local_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro  # Auto-register server
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reliefcare-local

# -----------------------------------------------------------
# Volumes
# -----------------------------------------------------------
volumes:
  postgres_local_data:
    name: reliefcare-local-postgres-data
  pgadmin_local_data:
    external: true
    name: reliefcare-local-pgadmin-data

# -----------------------------------------------------------
# Networks
# -----------------------------------------------------------
networks:
  reliefcare-local:
    name: reliefcare-local-network
    driver: bridge

