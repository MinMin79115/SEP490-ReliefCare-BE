# =============================================================
# ReliefCare - Local Development Docker Compose
# =============================================================
# Dùng để chạy và test trên máy local.
# Tất cả giá trị đã được hardcode - clone về chạy ngay, không cần .env
#
# Cách dùng:
#   docker compose up --build
#   docker compose up --build -d   (chạy background)
#   docker compose down            (dừng)
#   docker compose down -v         (dừng + xóa volume)
#   docker compose logs -f         (xem log)
#
# Swagger UI: http://localhost:8080/swagger
# API:        http://localhost:8080
# PostgreSQL: localhost:5432
# pgAdmin:    http://localhost:5050  (admin@reliefcare.local / admin123)
# =============================================================

services:
  # -----------------------------------------------------------
  # PostgreSQL Database
  # -----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: reliefcare-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: relief_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    networks:
      - reliefcare-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d relief_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -----------------------------------------------------------
  # ReliefCare API - Build từ source code local
  # -----------------------------------------------------------
  reliefcare-api:
    container_name: reliefcare-local-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: ReliefManagementSystem.API/Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=relief_db;Username=postgres;Password=postgres123"

      # JWT - chỉ dùng cho local, KHÔNG dùng key này cho production
      Jwt__Key: "local-dev-reliefcare-secret-key-minimum-32-characters-long"
      Jwt__Issuer: "ReliefSystem"
      Jwt__Audience: "ReliefClient"
      Jwt__AccessTokenMinutes: "60"
      Jwt__RefreshTokenDays: "7"

      # Google OAuth - để trống, không test Google login trên local docker
      AuthenticationGoogle__Google__ClientId: ""
      AuthenticationGoogle__Google__ClientSecret: ""

      # CORS - cho phép các frontend local phổ biến
      CorsSettings__AllowedOrigins__0: "http://localhost:3000"
      CorsSettings__AllowedOrigins__1: "http://localhost:5173"
      CorsSettings__AllowedOrigins__2: "http://localhost:4200"
      CorsSettings__AllowedOrigins__3: "http://localhost:8080"

      # ASP.NET Core - Development mode bật Swagger
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"

      # Logging - verbose hơn để dễ debug
      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__Microsoft__AspNetCore: "Information"
      Logging__LogLevel__Microsoft__EntityFrameworkCore: "Information"
    ports:
      - "8080:8080"
    networks:
      - reliefcare-local
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # -----------------------------------------------------------
  # pgAdmin 4 - Giao diện quản lý PostgreSQL
  # -----------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: reliefcare-local-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@reliefcare.com"
      PGADMIN_DEFAULT_PASSWORD: "admin123"
      PGADMIN_CONFIG_SERVER_MODE: "False"              # Desktop mode - không cần login lần 2
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_local_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro  # Auto-register server
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reliefcare-local

# -----------------------------------------------------------
# Volumes
# -----------------------------------------------------------
volumes:
  postgres_local_data:
    name: reliefcare-local-postgres-data
  pgadmin_local_data:
    name: reliefcare-local-pgadmin-data

# -----------------------------------------------------------
# Networks
# -----------------------------------------------------------
networks:
  reliefcare-local:
    name: reliefcare-local-network
    driver: bridge
