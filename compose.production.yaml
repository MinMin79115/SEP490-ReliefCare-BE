services:
  postgres:
    image: postgres:16-alpine
    container_name: reliefcare-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relief_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reliefcare-production

  reliefcare-api:
    image: ${REGISTRY:-ghcr.io/minmin79115/sep490-reliefcare-be}/reliefcare-api:latest
    container_name: reliefcare-api-prod
    restart: unless-stopped
    build:
      context: .
      dockerfile: ReliefManagementSystem.API/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-relief_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: "ReliefSystem"
      Jwt__Audience: "ReliefClient"
      Jwt__AccessTokenMinutes: "15"
      Jwt__RefreshTokenDays: "7"
      AuthenticationGoogle__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      AuthenticationGoogle__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      WeatherApi__BaseUrl: ${WEATHER_API_BASE_URL:-https://api.weatherapi.com/v1}
      WeatherApi__ApiKey: ${WEATHER_API_KEY:-}
      VisualCrossing__BaseUrl: ${VISUAL_CROSSING_BASE_URL:-https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline}
      VisualCrossing__ApiKey: ${VISUAL_CROSSING_API_KEY:-}
      VisualCrossing__UnitGroup: ${VISUAL_CROSSING_UNIT_GROUP:-metric}
      VisualCrossing__ForecastDays: ${VISUAL_CROSSING_FORECAST_DAYS:-14}
      VisualCrossing__Include: ${VISUAL_CROSSING_INCLUDE:-days}
      VisualCrossing__Elements: ${VISUAL_CROSSING_ELEMENTS:-datetime,tempmax,tempmin,precip,precipprob,precipcover,humidity,cloudcover,pressure,windspeed,windgust,visibility,severerisk,cape,cin,snow,snowdepth}
      VisualCrossing__ExcludeNullValues: ${VISUAL_CROSSING_EXCLUDE_NULLS:-true}
      LlmProvider__BaseUrl: ${LLM_PROVIDER_BASE_URL:-}
      LlmProvider__ApiKey: ${LLM_PROVIDER_API_KEY:-}
      LlmProvider__ProviderName: ${LLM_PROVIDER_NAME:-OpenAI-Compatible}
      LlmProvider__DefaultModel: ${LLM_PROVIDER_DEFAULT_MODEL:-gpt-4o-mini}
      LlmProvider__ChatCompletionsPath: ${LLM_PROVIDER_CHAT_COMPLETIONS_PATH:-/chat/completions}
      LlmProvider__Temperature: ${LLM_PROVIDER_TEMPERATURE:-0.2}
      LlmProvider__MaxTokens: ${LLM_PROVIDER_MAX_TOKENS:-600}
      PayOs__ClientId: ${PAYOS_CLIENT_ID:-}
      PayOs__ApiKey: ${PAYOS_API_KEY:-}
      PayOs__ChecksumKey: ${PAYOS_CHECKSUM_KEY:-}
      PayOs__ReturnUrl: ${PAYOS_RETURN_URL:-https://reliefhub.info.vn/donation/return}
      PayOs__CancelUrl: ${PAYOS_CANCEL_URL:-https://reliefhub.info.vn/donation/cancel}
      PayOs__ExpiredMinutes: ${PAYOS_EXPIRED_MINUTES:-15}
      CorsSettings__AllowedOrigins__0: "https://reliefhub.info.vn"
      CorsSettings__AllowedOrigins__1: "https://www.reliefhub.info.vn"
      CorsSettings__AllowedOrigins__2: "https://api.reliefhub.info.vn"
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      Logging__LogLevel__Default: "Warning"
      Logging__LogLevel__Microsoft__AspNetCore: "Warning"
      Logging__LogLevel__Microsoft__EntityFrameworkCore: "Warning"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    networks:
      - reliefcare-production

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: reliefcare-cloudflared-prod
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      reliefcare-api:
        condition: service_started
    networks:
      - reliefcare-production

volumes:
  postgres_data:
    name: reliefcare-production-postgres-data

networks:
  reliefcare-production:
    name: reliefcare-production-network
    driver: bridge
