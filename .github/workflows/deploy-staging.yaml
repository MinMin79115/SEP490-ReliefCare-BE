name: Build and Deploy Staging
on:
  # Trigger when PR is merged to staging
  pull_request:
    types: [closed]
    branches: [staging]
  # Manual trigger for emergency deploys
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-22.04
    # Only run if PR was merged OR manual trigger
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    outputs:
      services: ${{ steps.changes.outputs.services }}
      reliefcare-api: ${{ steps.changes.outputs.reliefcare-api }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Check for changes
        id: changes
        run: |
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "")

          # If no previous commit (first push), build all
          if [ -z "$CHANGED_FILES" ]; then
            echo "First push detected - building all services"
            echo "reliefcare-api=true" >> $GITHUB_OUTPUT
            echo 'services=["reliefcare-api"]' >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Initialize services array
          SERVICES="["
          FIRST=true

          # Check reliefcare-api changes (API, Application, Domain, Infrastructure, compose files)
          if echo "$CHANGED_FILES" | grep -E "^ReliefManagementSystem\.(API|Application|Domain|Infrastructure)/|^compose" > /dev/null; then
            echo "reliefcare-api=true" >> $GITHUB_OUTPUT
            if [ "$FIRST" = true ]; then
              SERVICES="${SERVICES}\"reliefcare-api\""
              FIRST=false
            else
              SERVICES="${SERVICES},\"reliefcare-api\""
            fi
          else
            echo "reliefcare-api=false" >> $GITHUB_OUTPUT
          fi

          SERVICES="${SERVICES}]"
          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          echo "Services to build: $SERVICES"

  api-image-build:
    name: Build / API
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: DockerHub Login
        uses: docker/login-action@v3.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/$REPO_LOWER" >> $GITHUB_ENV

      - name: Build Image And Push
        run: |
          echo "Building service: ${{ matrix.service }}"
          docker compose -f compose.staging.yaml build ${{ matrix.service }}
          docker compose -f compose.staging.yaml push ${{ matrix.service }}

  api-image-deploy:
    name: Deploy / API
    runs-on: self-hosted # Chạy trên EC2 của bạn
    needs: [api-image-build, detect-changes]
    if: needs.detect-changes.outputs.services != '[]'
    permissions:
      contents: read
      packages: write
    env:
      # Các biến môi trường lấy từ Secrets
      POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
      JWT_KEY: ${{ secrets.STAGING_JWT_KEY }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_TUNNEL_TOKEN }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.STAGING_GOOGLE_CLIENT_SECRET }}
      EMAIL_USERNAME: ${{ secrets.STAGING_EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.STAGING_EMAIL_PASSWORD }}
      CLOUDINARY_API_KEY: ${{ secrets.STAGING_CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.STAGING_CLOUDINARY_API_SECRET }}
      GOONG_API_KEY: ${{ secrets.STAGING_GOONG_API_KEY }}
      WEATHER_API_KEY: ${{ secrets.STAGING_WEATHER_API_KEY }}
      PAYOS_CLIENT_ID: ${{ secrets.STAGING_PAYOS_CLIENT_ID }}
      PAYOS_API_KEY: ${{ secrets.STAGING_PAYOS_API_KEY }}
      PAYOS_CHECKSUM_KEY: ${{ secrets.STAGING_PAYOS_CHECKSUM_KEY }}
      PGADMIN_PASSWORD: ${{ secrets.STAGING_PGADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: DockerHub Login
        uses: docker/login-action@v3.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Environment Variables
        run: |
          # Chuyển tên repo về chữ thường cho đúng chuẩn Docker
          echo "REGISTRY=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Free Disk Space Before Deploy
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h /
          echo "=== Cleaning up unused Docker resources ==="
          # Xóa images không dùng, stopped containers, unused networks, build cache
          # Không dùng --volumes để bảo vệ data volumes (postgres, pgadmin)
          docker system prune -a -f
          echo "=== Disk usage after cleanup ==="
          df -h /

      - name: Pull and Deploy
        run: |
          echo "Pulling latest images..."
          docker compose -f compose.staging.yaml pull

          echo "Deploying application..."
          docker compose -f compose.staging.yaml up -d --remove-orphans

      - name: Wait for Healthcheck
        run: |
          echo "Waiting for services to be ready..."
          sleep 15
          docker compose -f compose.staging.yaml ps

          MAX_RETRIES=10
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ Staging API is healthy!"
              break
            else
              echo "⏳ Waiting for staging API... ($((RETRY_COUNT + 1))/$MAX_RETRIES)"
              sleep 10
              RETRY_COUNT=$((RETRY_COUNT + 1))
            fi
          done

          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "❌ Staging API health check failed after $MAX_RETRIES attempts"
            docker compose -f compose.staging.yaml logs reliefcare-api
            exit 1
          fi

      - name: Cleanup Dangling Images After Deploy
        run: |
          # Chỉ xóa dangling images (không tag) sau deploy, giữ lại images đang dùng
          docker image prune -f

