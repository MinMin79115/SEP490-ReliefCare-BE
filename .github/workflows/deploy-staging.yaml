name: Build and Deploy Staging
on:
  # Trigger when PR is merged to staging
  pull_request:
    types: [closed]
    branches: [staging]
  # Manual trigger for emergency deploys
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-22.04
    # Only run if PR was merged OR manual trigger
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    outputs:
      services: ${{ steps.changes.outputs.services }}
      reliefcare-api: ${{ steps.changes.outputs.reliefcare-api }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Check for changes
        id: changes
        run: |
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "")

          # If no previous commit (first push), build all
          if [ -z "$CHANGED_FILES" ]; then
            echo "First push detected - building all services"
            echo "reliefcare-api=true" >> $GITHUB_OUTPUT
            echo 'services=["reliefcare-api"]' >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Initialize services array
          SERVICES="["
          FIRST=true

          # Check reliefcare-api changes (API, Application, Domain, Infrastructure, compose files, centrifugo config)
          if echo "$CHANGED_FILES" | grep -E "^ReliefManagementSystem\.(API|Application|Domain|Infrastructure)/|^compose|^centrifugo/" > /dev/null; then
            echo "reliefcare-api=true" >> $GITHUB_OUTPUT
            if [ "$FIRST" = true ]; then
              SERVICES="${SERVICES}\"reliefcare-api\""
              FIRST=false
            else
              SERVICES="${SERVICES},\"reliefcare-api\""
            fi
          else
            echo "reliefcare-api=false" >> $GITHUB_OUTPUT
          fi

          SERVICES="${SERVICES}]"
          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          echo "Services to build: $SERVICES"

  api-image-build:
    name: Build / API
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: DockerHub Login
        uses: docker/login-action@v3.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/$REPO_LOWER" >> $GITHUB_ENV
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build Image And Push
        run: |
          echo "Building service: ${{ matrix.service }}"
          echo "Using image tag: ${IMAGE_TAG}"

          if [ "${{ matrix.service }}" = "reliefcare-api" ]; then
            docker build \
              -f ReliefManagementSystem.API/Dockerfile \
              -t ${REGISTRY}/reliefcare-api:${IMAGE_TAG} \
              -t ${REGISTRY}/reliefcare-api:latest \
              .

            docker push ${REGISTRY}/reliefcare-api:${IMAGE_TAG}
            docker push ${REGISTRY}/reliefcare-api:latest
          else
            echo "Unsupported service: ${{ matrix.service }}"
            exit 1
          fi

  api-image-deploy:
    name: Deploy / API
    runs-on: self-hosted # Chạy trên EC2 của bạn
    needs: [api-image-build, detect-changes]
    if: needs.detect-changes.outputs.services != '[]'
    permissions:
      contents: read
      packages: write
    env:
      # Các biến môi trường lấy từ Secrets
      POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
      JWT_KEY: ${{ secrets.STAGING_JWT_KEY }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_TUNNEL_TOKEN }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.STAGING_GOOGLE_CLIENT_SECRET }}
      EMAIL_USERNAME: ${{ secrets.STAGING_EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.STAGING_EMAIL_PASSWORD }}
      CLOUDINARY_API_KEY: ${{ secrets.STAGING_CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.STAGING_CLOUDINARY_API_SECRET }}
      GOONG_API_KEY: ${{ secrets.STAGING_GOONG_API_KEY }}
      WEATHER_API_KEY: ${{ secrets.STAGING_WEATHER_API_KEY }}
      LLM_PROVIDER_API_KEY: ${{ secrets.STAGING_LLM_PROVIDER_API_KEY }}
      PAYOS_CLIENT_ID: ${{ secrets.STAGING_PAYOS_CLIENT_ID }}
      PAYOS_API_KEY: ${{ secrets.STAGING_PAYOS_API_KEY }}
      PAYOS_CHECKSUM_KEY: ${{ secrets.STAGING_PAYOS_CHECKSUM_KEY }}
      PGADMIN_PASSWORD: ${{ secrets.STAGING_PGADMIN_PASSWORD }}
      CENTRIFUGO_API_KEY: ${{ secrets.STAGING_CENTRIFUGO_API_KEY }}
      CENTRIFUGO_SECRET: ${{ secrets.STAGING_CENTRIFUGO_SECRET }}
      CENTRIFUGO_PUBLIC_WS_URL: ${{ vars.STAGING_CENTRIFUGO_PUBLIC_WS_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: DockerHub Login
        uses: docker/login-action@v3.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Environment Variables
        shell: powershell
        run: |
          # Chuyển tên repo về chữ thường cho đúng chuẩn Docker
          $repoLower = "${{ github.repository }}".ToLower()
          "REGISTRY=ghcr.io/$repoLower" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IMAGE_TAG=${{ github.sha }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate Centrifugo Staging Config
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CENTRIFUGO_API_KEY)) {
            throw "Missing STAGING_CENTRIFUGO_API_KEY secret"
          }

          if ([string]::IsNullOrWhiteSpace($env:CENTRIFUGO_SECRET)) {
            throw "Missing STAGING_CENTRIFUGO_SECRET secret"
          }

          $configPath = "centrifugo/config.staging.json"
          $content = Get-Content $configPath -Raw
          $content = $content.Replace("__CENTRIFUGO_API_KEY__", $env:CENTRIFUGO_API_KEY)
          $content = $content.Replace("__CENTRIFUGO_SECRET__", $env:CENTRIFUGO_SECRET)
          Set-Content -Path $configPath -Value $content -NoNewline

      - name: Free Disk Space Before Deploy
        shell: powershell
        run: |
          Write-Host "=== Disk usage before cleanup ==="
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize
          Write-Host "=== Cleaning up unused Docker resources ==="
          # Xóa images không dùng, stopped containers, unused networks, build cache
          # Không dùng --volumes để bảo vệ data volumes (postgres, pgadmin)
          docker system prune -a -f
          Write-Host "=== Disk usage after cleanup ==="
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      - name: Pull and Deploy
        shell: powershell
        run: |
          Write-Host "Deploying image tag: $env:IMAGE_TAG"
          Write-Host "Stopping existing staging stack..."
          docker compose -p reliefcare-staging -f compose.staging.yaml down

          Write-Host "Removing staging Postgres volume only..."
          $volumeName = "reliefcare-staging-postgres-data"
          $volumeExists = docker volume ls -q --filter "name=^${volumeName}$"
          if ($volumeExists) {
            docker volume rm $volumeName
          }
          else {
            Write-Host "Volume $volumeName does not exist. Skipping removal."
          }

          Write-Host "Pulling latest images..."
          docker compose -p reliefcare-staging -f compose.staging.yaml pull

          Write-Host "Deploying core services first..."
          docker compose -p reliefcare-staging -f compose.staging.yaml up -d postgres centrifugo reliefcare-api pgadmin

          Write-Host "Running API image after deploy:"
          docker inspect reliefcare-api --format='{{.Config.Image}}'

      - name: Wait for Healthcheck
        shell: powershell
        run: |
          Write-Host "Waiting for services to be ready..."
          Start-Sleep -Seconds 15
          docker compose -p reliefcare-staging -f compose.staging.yaml ps

          $centrifugoHealthy = $false

          for ($retry = 1; $retry -le 10; $retry++) {
            try {
              $centrifugoResponse = Invoke-WebRequest -Uri "http://127.0.0.1:8000/health" -UseBasicParsing -TimeoutSec 10
              if ($centrifugoResponse.StatusCode -ge 200 -and $centrifugoResponse.StatusCode -lt 300) {
                Write-Host "✅ Centrifugo is healthy!"
                $centrifugoHealthy = $true
                break
              }
            }
            catch {
              Write-Host "⏳ Waiting for Centrifugo... ($retry/10)"
            }

            Start-Sleep -Seconds 5
          }

          if (-not $centrifugoHealthy) {
            Write-Host "❌ Centrifugo health check failed"
            docker compose -p reliefcare-staging -f compose.staging.yaml logs centrifugo
            exit 1
          }

          $maxRetries = 10
          $isHealthy = $false

          for ($retry = 1; $retry -le $maxRetries; $retry++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:8080/health" -UseBasicParsing -TimeoutSec 10
              if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 300) {
                Write-Host "✅ Staging API is healthy!"
                $isHealthy = $true
                break
              }
            }
            catch {
              Write-Host "⏳ Waiting for staging API... ($retry/$maxRetries)"
            }

            Start-Sleep -Seconds 10
          }

          if (-not $isHealthy) {
            Write-Host "❌ Staging API health check failed after $maxRetries attempts"
            docker compose -p reliefcare-staging -f compose.staging.yaml logs reliefcare-api
            exit 1
          }

      - name: Start Cloudflared
        shell: powershell
        run: |
          Write-Host "Starting cloudflared after API is healthy..."
          docker compose -p reliefcare-staging -f compose.staging.yaml up -d cloudflared

          Start-Sleep -Seconds 8
          $cloudflaredStatus = docker inspect -f "{{.State.Status}}" reliefcare-cloudflared 2>$null

          if ($cloudflaredStatus -ne "running") {
            Write-Host "❌ cloudflared is not running"
            docker compose -p reliefcare-staging -f compose.staging.yaml logs cloudflared
            exit 1
          }

          Write-Host "✅ cloudflared is running"
          docker compose -p reliefcare-staging -f compose.staging.yaml ps

      - name: Cleanup Dangling Images After Deploy
        shell: powershell
        run: |
          # Chỉ xóa dangling images (không tag) sau deploy, giữ lại images đang dùng
          docker image prune -f

