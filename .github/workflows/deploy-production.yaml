name: Build and Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  COMPOSE_FILE: compose.production.yaml
  COMPOSE_PROJECT_NAME: reliefcare-production
  API_SERVICE: reliefcare-api-production
  API_IMAGE_NAME: reliefcare-api
  API_CONTAINER: reliefcare-api-prod

jobs:
  api-image-build:
    name: Build / API
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image variables
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/$REPO_LOWER" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Build and push API image
        run: |
          docker build \
            -f ReliefManagementSystem.API/Dockerfile \
            -t "$REGISTRY/$API_IMAGE_NAME:$IMAGE_TAG" \
            -t "$REGISTRY/$API_IMAGE_NAME:production-latest" \
            .
          docker push "$REGISTRY/$API_IMAGE_NAME:$IMAGE_TAG"
          docker push "$REGISTRY/$API_IMAGE_NAME:production-latest"

  api-image-deploy:
    name: Deploy / API
    runs-on: self-hosted
    needs: api-image-build
    permissions:
      contents: read
      packages: read
    env:
      POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
      JWT_KEY: ${{ secrets.PROD_JWT_KEY }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.PROD_CLOUDFLARE_TUNNEL_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.PROD_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
      EMAIL_USERNAME: ${{ secrets.PROD_EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.PROD_EMAIL_PASSWORD }}
      CLOUDINARY_API_KEY: ${{ secrets.PROD_CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.PROD_CLOUDINARY_API_SECRET }}
      GOONG_API_KEY: ${{ secrets.PROD_GOONG_API_KEY }}
      WEATHER_API_KEY: ${{ secrets.PROD_WEATHER_API_KEY }}
      VISUAL_CROSSING_API_KEY: ${{ secrets.PROD_VISUAL_CROSSING_API_KEY }}
      LLM_PROVIDER_BASE_URL: ${{ secrets.PROD_LLM_PROVIDER_BASE_URL }}
      LLM_PROVIDER_API_KEY: ${{ secrets.PROD_LLM_PROVIDER_API_KEY }}
      LLM_PROVIDER_NAME: ${{ secrets.PROD_LLM_PROVIDER_NAME }}
      LLM_PROVIDER_DEFAULT_MODEL: ${{ secrets.PROD_LLM_PROVIDER_DEFAULT_MODEL }}
      PAYOS_CLIENT_ID: ${{ secrets.PROD_PAYOS_CLIENT_ID }}
      PAYOS_API_KEY: ${{ secrets.PROD_PAYOS_API_KEY }}
      PAYOS_CHECKSUM_KEY: ${{ secrets.PROD_PAYOS_CHECKSUM_KEY }}
      PAYOS_RETURN_URL: ${{ secrets.PROD_PAYOS_RETURN }}
      PAYOS_CANCEL_URL: ${{ secrets.PROD_PAYOS_CANCEL }}
      PGADMIN_PASSWORD: ${{ secrets.PROD_PGADMIN_PASSWORD }}
      CENTRIFUGO_API_KEY: ${{ secrets.PROD_CENTRIFUGO_API_KEY }}
      CENTRIFUGO_SECRET: ${{ secrets.PROD_CENTRIFUGO_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image variables
        shell: powershell
        run: |
          $repoLower = "${{ github.repository }}".ToLowerInvariant()
          "REGISTRY=ghcr.io/$repoLower" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IMAGE_TAG=${{ github.sha }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate deploy inputs
        shell: powershell
        run: |
          $required = @(
            "REGISTRY",
            "IMAGE_TAG",
            "POSTGRES_PASSWORD",
            "JWT_KEY",
            "CLOUDFLARE_TUNNEL_TOKEN",
            "CENTRIFUGO_API_KEY",
            "CENTRIFUGO_SECRET",
            "PGADMIN_PASSWORD"
          )

          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required environment variable: $name"
            }
          }

          docker compose -p $env:COMPOSE_PROJECT_NAME -f $env:COMPOSE_FILE config --quiet

      - name: Generate Centrifugo production config
        shell: powershell
        run: |
          $configPath = "centrifugo/config.production.json"
          $content = Get-Content $configPath -Raw
          $content = $content.Replace("__CENTRIFUGO_API_KEY__", $env:CENTRIFUGO_API_KEY)
          $content = $content.Replace("__CENTRIFUGO_SECRET__", $env:CENTRIFUGO_SECRET)
          Set-Content -Path $configPath -Value $content -NoNewline

      - name: Backup database
        shell: powershell
        run: |
          Write-Host "Creating database backup before deployment..."
          New-Item -ItemType Directory -Force -Path "./backups" | Out-Null

          $containers = docker ps --format '{{.Names}}'
          if ($containers -contains "reliefcare-postgres-prod") {
            $backupFile = "./backups/backup_$(Get-Date -Format 'yyyyMMdd_HHmmss').sql"
            docker exec reliefcare-postgres-prod pg_dump -U postgres relief_db | Out-File -FilePath $backupFile -Encoding utf8
            Write-Host "Backup created: $backupFile"
            Get-ChildItem -Path "./backups" -Filter "backup_*.sql" | Sort-Object LastWriteTime -Descending | Select-Object -Skip 5 | Remove-Item -Force
          } else {
            Write-Host "Database container not running, skipping backup"
          }

      - name: Capture current API image
        id: current-image
        shell: powershell
        run: |
          $containerExists = docker ps -a --format '{{.Names}}' | Where-Object { $_ -eq $env:API_CONTAINER }
          if ($containerExists) {
            $currentImage = docker inspect $env:API_CONTAINER --format='{{.Config.Image}}'
          } else {
            $currentImage = ""
          }
          "image=$currentImage" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if (-not [string]::IsNullOrWhiteSpace($currentImage)) {
            Write-Host "Current API image: $currentImage"
          } else {
            Write-Host "No existing API container found"
          }

      - name: Pull production images
        shell: powershell
        run: |
          docker compose -p $env:COMPOSE_PROJECT_NAME -f $env:COMPOSE_FILE pull postgres centrifugo pgadmin cloudflared
          docker compose -p $env:COMPOSE_PROJECT_NAME -f $env:COMPOSE_FILE pull $env:API_SERVICE

      - name: Ensure dependencies are running
        shell: powershell
        run: |
          docker compose -p $env:COMPOSE_PROJECT_NAME -f $env:COMPOSE_FILE up -d postgres centrifugo pgadmin

      - name: Deploy API
        shell: powershell
        run: |
          docker compose -p $env:COMPOSE_PROJECT_NAME -f $env:COMPOSE_FILE up -d --no-deps $env:API_SERVICE

      - name: Wait for healthcheck
        shell: powershell
        run: |
          Write-Host "Waiting for API to be ready..."
          $maxRetries = 24

          for ($retry = 1; $retry -le $maxRetries; $retry++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:8080/health" -UseBasicParsing -TimeoutSec 10
              if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 300) {
                Write-Host "API is healthy"
                docker compose -p $env:COMPOSE_PROJECT_NAME -f $env:COMPOSE_FILE ps
                exit 0
              }
            } catch {
              Write-Host "Waiting for API... ($retry/$maxRetries)"
            }
            Start-Sleep -Seconds 10
          }

          Write-Host "API health check failed after $maxRetries attempts"
          docker compose -p $env:COMPOSE_PROJECT_NAME -f $env:COMPOSE_FILE logs --tail=200 $env:API_SERVICE
          exit 1

      - name: Ensure tunnel is running
        shell: powershell
        run: |
          docker compose -p $env:COMPOSE_PROJECT_NAME -f $env:COMPOSE_FILE up -d cloudflared

      - name: Roll back API on failure
        if: failure() && steps.current-image.outputs.image != ''
        env:
          PREVIOUS_IMAGE: ${{ steps.current-image.outputs.image }}
        shell: powershell
        run: |
          Write-Host "Rolling back API to $env:PREVIOUS_IMAGE"
          $previousTag = ($env:PREVIOUS_IMAGE -split ":")[-1]
          if ([string]::IsNullOrWhiteSpace($previousTag) -or $previousTag -eq $env:PREVIOUS_IMAGE) {
            throw "Cannot determine previous image tag from $env:PREVIOUS_IMAGE"
          }

          "IMAGE_TAG=$previousTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:IMAGE_TAG = $previousTag
          docker compose -p $env:COMPOSE_PROJECT_NAME -f $env:COMPOSE_FILE up -d --no-deps $env:API_SERVICE

      - name: Cleanup dangling images
        if: always()
        run: |
          docker image prune -f

      - name: Deployment result
        if: always()
        shell: powershell
        run: |
          $status = "${{ job.status }}"
          if ($status -eq "success") {
            $image = "{0}/{1}:{2}" -f $env:REGISTRY, $env:API_IMAGE_NAME, $env:IMAGE_TAG
            Write-Host "Production deployment successful: $image"
          } else {
            Write-Host "Production deployment failed"
          }
