services:
  # -----------------------------------------------------------
  # PostgreSQL Database
  # -----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: reliefcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relief_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Không expose port ra ngoài host - API kết nối qua internal network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-relief_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - reliefcare-staging

  # -----------------------------------------------------------
  # Redis Cache
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: reliefcare-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reliefcare-staging

  # -----------------------------------------------------------
  # Centrifugo Realtime Server
  # -----------------------------------------------------------
  centrifugo:
    image: centrifugo/centrifugo:v6
    container_name: reliefcare-centrifugo
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./centrifugo/config.staging.json:/centrifugo/config.json:ro
    command: centrifugo --config=/centrifugo/config.json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - reliefcare-staging

  # -----------------------------------------------------------
  # ReliefCare API - Pull image từ GHCR (không build tại đây)
  # -----------------------------------------------------------
  reliefcare-api:
    image: ${REGISTRY:-ghcr.io/minmin79115/sep490-reliefcare-be}/reliefcare-api:${IMAGE_TAG:-latest}
    container_name: reliefcare-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-relief_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: "ReliefSystem"
      Jwt__Audience: "ReliefClient"
      Jwt__AccessTokenMinutes: "15"
      Jwt__RefreshTokenDays: "7"
      AuthenticationGoogle__Google__ClientId: "914612994476-7tdvcqqm1e97mir23ilunou2vgmd4s5b.apps.googleusercontent.com"
      AuthenticationGoogle__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      EmailSettings__Host: "smtp-relay.brevo.com"
      EmailSettings__Port: "587"
      EmailSettings__Username: ${EMAIL_USERNAME:-}
      EmailSettings__Password: ${EMAIL_PASSWORD:-}
      EmailSettings__SenderEmail: "noreply@reliefhub.info.vn"
      EmailSettings__SenderName: "Relief Hub"
      CloudinarySettings__CloudName: "dhwnptz55"
      CloudinarySettings__ApiKey: ${CLOUDINARY_API_KEY:-}
      CloudinarySettings__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      Goong__BaseUrl: "https://rsapi.goong.io"
      Goong__ApiKey: ${GOONG_API_KEY:-}
      WeatherApi__BaseUrl: "https://api.weatherapi.com/v1"
      WeatherApi__ApiKey: ${WEATHER_API_KEY:-}
      VisualCrossing__BaseUrl: "https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline"
      VisualCrossing__ApiKey: ${VISUAL_CROSSING_API_KEY:-}
      VisualCrossing__UnitGroup: "metric"
      VisualCrossing__ForecastDays: "14"
      VisualCrossing__Include: "days"
      VisualCrossing__Elements: "datetime,tempmax,tempmin,precip,precipprob,precipcover,humidity,cloudcover,pressure,windspeed,windgust,visibility,severerisk,cape,cin,snow,snowdepth"
      VisualCrossing__ExcludeNullValues: "true"
      LlmProvider__BaseUrl: "https://api.apipro.me/v1"
      LlmProvider__ApiKey: ${LLM_PROVIDER_API_KEY:-}
      LlmProvider__ProviderName: "APIPro"
      LlmProvider__DefaultModel: "gpt-5.4"
      LlmProvider__ChatCompletionsPath: "/chat/completions"
      LlmProvider__Temperature: "0.2"
      LlmProvider__MaxTokens: "600"
      DisasterAnalysis__TopRiskCount: "3"
      DisasterAnalysis__IncludeEarthquakeInAutoDetect: "false"
      PayOs__ClientId: ${PAYOS_CLIENT_ID:-}
      PayOs__ApiKey: ${PAYOS_API_KEY:-}
      PayOs__ChecksumKey: ${PAYOS_CHECKSUM_KEY:-}
      PayOs__ReturnUrl: ${PAYOS_RETURN_URL:-}
      PayOs__CancelUrl: ${PAYOS_CANCEL_URL:-}
      PayOs__ExpiredMinutes: "15"
      Centrifugo__BaseUrl: "http://centrifugo:8000"
      Centrifugo__HttpApiKey: ${CENTRIFUGO_API_KEY}
      Centrifugo__ClientTokenSecret: ${CENTRIFUGO_SECRET}
      Centrifugo__PublicWebsocketUrl: "wss://staging.reliefhub.info.vn"
      Centrifugo__Issuer: "ReliefCare.API"
      Centrifugo__Audience: "ReliefCare.Realtime"
      Centrifugo__ConnectionTokenMinutes: "15"
      # CORS - domain thật + localhost để FE dev test local gọi lên staging API
      CorsSettings__AllowedOrigins__0: "https://staging.reliefhub.info.vn"
      CorsSettings__AllowedOrigins__1: "https://reliefhub.info.vn"
      CorsSettings__AllowedOrigins__2: "https://relief-carevn.vercel.app"
      CorsSettings__AllowedOrigins__3: "http://localhost:3000"
      CorsSettings__AllowedOrigins__4: "http://localhost:5173"
      CorsSettings__AllowedOrigins__5: "http://localhost:4200"
      ASPNETCORE_ENVIRONMENT: "Staging"
      ASPNETCORE_URLS: "http://+:8080"
      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__Microsoft__AspNetCore: "Information"
      Logging__LogLevel__Microsoft__EntityFrameworkCore: "Information"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    networks:
      - reliefcare-staging


  # -----------------------------------------------------------
  # pgAdmin 4 - Quản lý database staging
  # Truy cập: http://<server-ip>:5050
  # Khuyến nghị: dùng SSH tunnel để truy cập an toàn
  #   ssh -L 5050:localhost:5050 user@server
  # -----------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: reliefcare-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@reliefcare.com"
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"              # Desktop mode - giảm bớt bước đăng nhập
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reliefcare-staging

  # -----------------------------------------------------------
  # Cloudflare Tunnel - Expose API ra internet
  # -----------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: reliefcare-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      reliefcare-api:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
    networks:
      - reliefcare-staging

volumes:
  postgres_data:
    name: reliefcare-staging-postgres-data
  pgadmin_data:
    name: reliefcare-staging-pgadmin-data

networks:
  reliefcare-staging:
    name: reliefcare-staging-network
    driver: bridge






 
 





